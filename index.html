<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flamingos, Chai & Cats</title>
  <style>
    body {
      background: linear-gradient(to bottom, #fff7e6, #fff3f0);
      font-family: 'Comic Sans MS', cursive;
      color: #4b2e05;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }

    header {
      background: #ffeff8;
      text-align: center;
      padding: 15px;
      border-bottom: 3px dotted #ff69b4;
      box-shadow: 0 0 10px #ffc0cb;
    }

    header h1 {
      font-size: 2em;
      color: #d6336c;
      text-shadow: 1px 1px #ffffff;
    }

    marquee {
      color: #d6336c;
      background: #fff0f5;
      padding: 5px;
      border: 1px solid #ffb6c1;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .sidebar, .content {
      width: 95%;
      background: #fff;
      border: 2px dashed #ffb6c1;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 8px #ffc0cb;
    }

    .sidebar img {
      display: block;
      margin: 0 auto 10px auto;
      image-rendering: pixelated;
    }

    .sidebar h3, .content h3 {
      color: #d6336c;
    }

    #new-post textarea {
      width: 100%;
      height: 60px;
      border: 2px solid #ff69b4;
      border-radius: 5px;
      padding: 5px;
      font-family: inherit;
    }

    #new-post button {
      background: #ffe4e1;
      border: 2px solid #ff69b4;
      color: #4b2e05;
      font-weight: bold;
      border-radius: 5px;
      margin-top: 5px;
      cursor: pointer;
      box-shadow: 0 0 5px #ffb6c1;
    }

    #new-post button:hover {
      background: #ffb6c1;
      color: white;
    }

    .post {
      background: #fffaf8;
      border-left: 4px solid #ff69b4;
      padding: 10px;
      margin-top: 10px;
    }

    .post-date {
      text-align: right;
      font-size: 0.8em;
      color: #a0522d;
    }

    footer {
      background: #ffe4e1;
      text-align: center;
      padding: 10px;
      border-top: 2px dashed #ffb6c1;
      color: #a0522d;
      font-size: 0.9em;
    }

    @media (min-width: 768px) {
      main {
        flex-direction: row;
        justify-content: center;
        gap: 20px;
      }
      .sidebar {
        width: 30%;
      }
      .content {
        width: 60%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🦩 Flamingos, Chai & Cats ☕</h1>
    <marquee>Welcome to my light-mode retro corner 🌴🐾✨</marquee>
  </header>

  <main>
    <div class="sidebar">
      <h3>🌿 About Me</h3>
      <p>I love chai tea, rainforests, pink flamingos, and cuddly cats. 🌸🐱🌴</p>
      <hr>
      <h3>🐾 Mood</h3>
      <p>Sipping chai with my cat under the tropical breeze. ☀️</p>
    </div>

    <div class="content">
      <section id="new-post">
        <h3>💬 Add a New Message 💬</h3>
        <textarea id="postContent" placeholder="Write your sweet note..."></textarea><br>
        <button onclick="addPost()">Post 🌸</button>
      </section>
      <section id="posts"></section>
    </div>
  </main>

  <footer>
    <p>🦩 Flamingo Dreams ☕ | Hosted on <a href="https://github.com/">GitHub Pages</a></p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedPosts = JSON.parse(localStorage.getItem('flamingoPosts')) || [];
      const postsContainer = document.getElementById('posts');
      savedPosts.forEach(post => postsContainer.appendChild(createPostElement(post.content, post.date)));
    });

    function createPostElement(content, date) {
      const post = document.createElement('div');
      post.className = 'post';
      const text = document.createElement('p');
      text.innerHTML = content.replace(/\n/g, '<br>');
      const timestamp = document.createElement('div');
      timestamp.className = 'post-date';
      timestamp.textContent = date;
      post.appendChild(text);
      post.appendChild(timestamp);
      return post;
    }

    function addPost() {
      const content = document.getElementById('postContent').value.trim();
      if (!content) return alert('Please write something first!');
      const date = new Date().toLocaleString();
      const postsContainer = document.getElementById('posts');
      const newPost = createPostElement(content, date);
      postsContainer.insertBefore(newPost, postsContainer.firstChild);
      const saved = JSON.parse(localStorage.getItem('flamingoPosts')) || [];
      saved.unshift({ content, date });
      localStorage.setItem('flamingoPosts', JSON.stringify(saved));
      document.getElementById('postContent').value = '';
    }
  </script>
</body>
</html>
